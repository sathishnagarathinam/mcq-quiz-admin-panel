name: mcq_quiz_app
description: Complete preparation for Post Office departmental exams with comprehensive MCQ practice tests and performance analytics
publish_to: 'none'
version: 1.7.33+41

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase Authentication
  supabase_flutter: ^2.8.0

  # Firebase - Keep Firestore for now (can migrate to Supabase DB later)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  # HTTP client for Firebase Auth REST API
  http: ^1.1.0
  crypto: ^3.0.3
  # firebase_storage: ^11.5.6  # Temporarily disabled due to Crashlytics dependency
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.0.0
  # firebase_analytics: ^10.7.4  # Temporarily disabled due to Crashlytics dependency
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Navigation
  go_router: ^12.1.3
  
  # Utilities
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  device_info_plus: ^9.1.1
  share_plus: ^7.2.2  # For native sharing functionality

  # Payment
  package_info_plus: ^4.2.0
  url_launcher: ^6.2.2  # For UPI intent handling
  razorpay_flutter: ^1.3.7  # Razorpay payment gateway
  
  # Authentication
  pinput: ^3.0.1
  country_code_picker: ^3.0.0
  # google_sign_in: ^6.1.6  # Temporarily disabled due to iOS dependency conflict
  local_auth: ^2.1.7

  # Security
  # screen_protector: ^1.4.2  # Temporarily disabled due to iOS build issues

  # Notifications
  # flutter_local_notifications: ^15.1.0  # Temporarily disabled due to Android API compatibility
  
  # Charts and Analytics
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^24.2.9
  
  # File Handling
  path_provider: ^2.1.1
  
  # Date and Time
  intl: ^0.18.1
  
  # HTTP
  dio: ^5.4.0
  
  # Local Database
  sqflite: ^2.3.0
  
  # Image Handling - Using Android Photo Picker compliant version
  image_picker: ^1.1.2
  
  # Animations
  flutter_animate: ^4.3.0
  
  # Toast and Dialogs
  # fluttertoast: ^8.2.12  # Temporarily disabled due to Kotlin compatibility issues
  toastification: ^2.3.0  # Alternative toast library
  
  # Pull to Refresh
  pull_to_refresh: ^2.0.0
  flutter_pdfview: ^1.4.1+1
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/DPA.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # Remove alpha channel for iOS App Store compliance
  web:
    generate: true
    image_path: "assets/images/DPA.png"
    background_color: "#ffffff"
    theme_color: "#1976D2"
  
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
